{% extends "base.html" %}

{% block title %}{% endblock %}

{% block main_content %}
    <div class="container-fluid p-0">
        <h4 class="mb-4" id="formName"></h4>

        <div class="card">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 1200px">
                        <span class="input-group-text" required>onesLink</span>
                        <input type="text" id="onesLink" class="form-control" placeholder="onesLink">
                    </div>
                </div>
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 500px">
                        <span class="input-group-text">文件名</span>
                        <input type="text" id="filePrefix" class="form-control" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleEdit('filePrefix', this)"
                                title="点击编辑">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 500px">
                        <span class="input-group-text">编号</span>
                        <input type="text" id="dynamicNo" class="form-control" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleEdit('dynamicNo', this)"
                                title="点击编辑">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 500px">
                        <span class="input-group-text">操作备注</span>
                        <input type="text" id="ops_remark" class="form-control" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleEdit('ops_remark', this)"
                                title="点击编辑">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>

                <h4>查询字段</h4>
                <hr class="layui-border-blue">
                <!-- 动态生成的文本类型输入框容器 -->
                <div id="queryContainer">
                    <!-- 所有文本类型的新值在一行，所有原值在一行 -->
                </div>


                <h4>修改字段</h4>
                <hr class="layui-border-blue">
                <!-- 动态生成的下拉框容器 -->
                <div id="selectContainer">
                    <!-- 每种下拉框单独一行 -->
                </div>

                <!-- 动态生成的单选框容器 -->
                <div id="radioContainer">
                    <!-- 每种单选框单独一行 -->
                </div>

                <!-- 动态生成的数值类型输入框容器 -->
                <div id="numberInputContainer">
                    <!-- 所有数值类型的新值在一行，所有原值在一行 -->
                </div>

                <!-- 动态生成的文本类型输入框容器 -->
                <div id="textInputContainer">
                    <!-- 所有文本类型的新值在一行，所有原值在一行 -->
                </div>

                <!-- 动态生成的日期类型输入框容器 -->
                <div id="dateInputContainer">
                    <!-- 所有日期类型的新值在一行，所有原值在一行 -->
                </div>

                <!-- 动态生成的补充框容器 -->
                <div id="supplementContainer">
                    <!-- 每个补充框单独一行，包含主输入框和子输入框 -->
                </div>
                <!-- 功能按钮区域 -->
                <div class="row g-3 align-items-center mb-4" id="formActionButtons">
                    <div class="col-auto">
                        <a href="javascript:void(0)" onclick="downloadTemplate()" class="btn btn-outline-primary"
                           id="downloadTemplateBtn">
                            <i class="bi bi-download"></i> 下载导入模板
                        </a>
                    </div>
                    <div class="col-auto">
                        <input type="file" id="batchImportFile" accept=".xlsx" style="display: none;"
                               onchange="handleBatchImportFile(this)">
                        <button type="button" onclick="document.getElementById('batchImportFile').click()"
                                class="btn btn-outline-secondary"
                                id="batchImportBtn">
                            <i class="bi bi-upload"></i> 从文件导入
                        </button>
                    </div>
                    <div class="col-auto">
                        <button type="button" onclick="openOnlineEditor()"
                                class="btn btn-outline-success"
                                id="onlineEditorBtn">
                            <i class="bi bi-table"></i> 在线编辑导入
                        </button>
                    </div>
                    <div class="col-auto">
                        <button type="button" onclick="previewOnlineData()"
                                class="btn btn-outline-primary"
                                id="previewOnlineDataBtn">
                            <i class="bi bi-eye"></i> 预览已保存数据
                        </button>
                    </div>
                    <div class="col-auto">
                        <span id="batchImportFileName" style="color: #666; margin-left: 10px;"></span>
                    </div>
                    <div class="col-auto">
                        <span id="savedOnlineRowsStatus" style="margin-left: 10px;"></span>
                    </div>
                </div>

                <!-- 在线编辑器容器（Bootstrap 全屏模态框） -->
                <div class="modal fade" id="luckysheetModal" tabindex="-1" aria-labelledby="luckysheetModalLabel" aria-hidden="true" data-bs-focus="false">
                    <div class="modal-dialog modal-fullscreen">
                        <div class="modal-content">
                            <div class="modal-header py-2">
                                <h5 class="modal-title fs-6" id="luckysheetModalLabel">
                                    <i class="bi bi-table me-1"></i>在线编辑导入数据
                                </h5>
                                <div class="d-flex align-items-center gap-2 flex-wrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="importFromFile()">
                                        <i class="bi bi-file-earmark-excel"></i> 从Excel导入
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearSpreadsheetData()">
                                        <i class="bi bi-trash"></i> 清空数据
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="previewOnlineData()">
                                        <i class="bi bi-eye"></i> 预览
                                    </button>
                                    <button type="button" class="btn btn-sm btn-secondary" onclick="closeOnlineEditor()">取消</button>
                                    <button type="button" class="btn btn-sm btn-success" onclick="saveOnlineEditorData()">保存</button>
                                </div>
                            </div>
                            <div class="modal-body p-0" style="overflow: hidden; background: #f5f5f5;">
                                <div id="luckysheet" style="width: 100%; height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 在线编辑数据预览弹窗 -->
                <div class="modal fade" id="onlineDataPreviewModal" tabindex="-1" aria-labelledby="onlineDataPreviewModalLabel" aria-hidden="true" data-bs-focus="false">
                    <div class="modal-dialog modal-xl modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title fs-6" id="onlineDataPreviewModalLabel">
                                    <i class="bi bi-eye me-1"></i>已保存的在线编辑数据
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div id="onlineDataPreviewTable" style="max-height: 60vh; overflow: auto;">
                                    <p class="text-muted">暂无保存的数据</p>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                            </div>
                        </div>
                    </div>
                </div>
                <input type="file" id="xsImportFile" accept=".xlsx" style="display: none;" onchange="handleXsFileImport(this)">

                <!-- 提交结果显示区域 -->
                <div id="submitResultArea" style="display: none; margin-bottom: 20px;">
                    <div class="alert" id="resultAlert" role="alert">
                        <h5 class="alert-heading" id="resultTitle"></h5>
                        <p id="resultMessage"></p>
                        <hr>
                        <div id="resultActions"></div>
                    </div>
                </div>
                <button onclick="submit()" class="layui-btn">提交</button>


            </div>
        </div>
    </div>

    <!-- Luckysheet 模态框自定义样式 -->
    <style>
        /* 全屏模态框：给 Luckysheet 最大化编辑空间 */
        #luckysheetModal.modal {
            z-index: 1055;
        }
        #luckysheetModal .modal-header {
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        #luckysheetModal .modal-body {
            position: relative;
        }
        #luckysheetModal #luckysheet {
            width: 100%;
            height: 100%;
        }

        /* 确保 Luckysheet 内部弹出菜单、颜色选择器、函数提示框在模态框之上 */
        .luckysheet-cols-menu,
        .luckysheet-rightgclick-menu,
        .luckysheet-toolbar-button-hover,
        .luckysheet-toolbar-submenu,
        .luckysheet-color-picker,
        .luckysheet-functionbox,
        .luckysheet-formula-function-criteria {
            z-index: 1060 !important;
        }
        /* 部分 Luckysheet 弹窗使用行内 style，通过父容器层级兜底 */
        #luckysheet-modal-dialog-mask,
        .luckysheet-modal-dialog-mask,
        .luckysheet-modal-dialog-slider {
            z-index: 1060 !important;
        }

        /* 恢复 Bootstrap 5 按钮样式，避免被 Luckysheet 的 .btn 规则覆盖 */
        #formActionButtons .btn,
        .input-group .btn,
        .layui-btn {
            padding: 0.375rem 0.75rem !important;
            font-size: 1rem !important;
            line-height: 1.5 !important;
            border-radius: 0.25rem !important;
            background-image: none !important;
        }
        #formActionButtons .btn-outline-primary,
        .input-group .btn-outline-secondary {
            background-color: transparent !important;
        }
        #formActionButtons .btn-outline-primary {
            color: #0d6efd !important;
            border-color: #0d6efd !important;
        }
        #formActionButtons .btn-outline-primary:hover {
            color: #fff !important;
            background-color: #0d6efd !important;
        }
        #formActionButtons .btn-outline-secondary,
        .input-group .btn-outline-secondary {
            color: #6c757d !important;
            border-color: #6c757d !important;
        }
        #formActionButtons .btn-outline-secondary:hover,
        .input-group .btn-outline-secondary:hover {
            color: #fff !important;
            background-color: #6c757d !important;
        }
        #formActionButtons .btn-outline-success {
            color: #198754 !important;
            border-color: #198754 !important;
        }
        #formActionButtons .btn-outline-success:hover {
            color: #fff !important;
            background-color: #198754 !important;
        }

        /* 确保 Luckysheet 单元格输入框在 Bootstrap 模态框之上，避免输入被遮挡 */
        #luckysheet-input-box,
        .luckysheet-input-box {
            z-index: 9999 !important;
        }

    </style>

    <!-- 引入 Layui 样式 -->
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/js/luckysheet/assets/iconfont/iconfont.css">
    <link rel="stylesheet" href="/static/js/luckysheet/pluginsCss.css">
    <link rel="stylesheet" href="/static/js/luckysheet/plugins.css">
    <link rel="stylesheet" href="/static/js/luckysheet/luckysheet.css">

    <!-- 引入 JS 库 -->
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/jquery-3.7.1.min.js"></script>
    <script src="/static/js/jquery.mousewheel.min.js"></script>
    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/sheetjs/xlsx.full.min.js"></script>
    <script src="/static/js/luckysheet/luckysheet.umd.js"></script>

    <script>

        /**
         * 存储批量导入的文件
         */
        let batchImportFile = null;

        // 存储所有 Layui 日期选择器实例
        const laydateInstances = [];

        // 全局配置对象
        let dynamicTableConfig = null;
        // 存储所有 Layui dropdown 实例
        const dropdownInstances = [];

        // 全局变量：配置项数组
        let gSelectItems = [];
        let gRadioItems = [];
        let gNumberInputItems = [];
        let gTextInputItems = [];
        let gDateInputItems = [];
        let gSupplementItems = [];


        // 存储当前激活的输入框信息
        let currentActiveInput = null;

        // 存储 Layui 表格弹出层实例
        let tableLayerIndex = null;

        // 存储在线编辑保存的数据行
        let savedOnlineRows = [];

        // 存储待回显到在线表格的行级校验错误
        let pendingValidationErrors = null;

        /**
         * 切换输入框的编辑状态
         * @param {string} inputId - 输入框ID
         * @param {HTMLElement} button - 按钮元素
         */
        window.toggleEdit = function (inputId, button) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const isReadonly = input.hasAttribute('readonly');

            if (isReadonly) {
                // 切换到编辑状态
                input.removeAttribute('readonly');
                input.focus();

                // 更改按钮图标和提示
                button.innerHTML = '<i class="bi bi-check-lg"></i>';
                button.title = '完成编辑';
                button.classList.remove('btn-outline-secondary');
                button.classList.add('btn-success');

                // 添加失去焦点事件，自动恢复只读
                input.addEventListener('blur', function handler() {
                    toggleEdit(inputId, button);
                    input.removeEventListener('blur', handler);
                }, {once: true});
            } else {
                // 切换到只读状态
                input.setAttribute('readonly', 'readonly');

                // 恢复按钮图标和提示
                button.innerHTML = '<i class="bi bi-pencil-square"></i>';
                button.title = '点击编辑';
                button.classList.remove('btn-success');
                button.classList.add('btn-outline-secondary');
            }
        };

        /**
         * 从ones链接中解析内容
         * @param {string} url - ones链接
         * @returns {Object} 解析结果 {taskId, taskName}
         */
        function parseOnesLink(url) {
            if (!url || typeof url !== 'string') {
                return null;
            }

            try {
                // 匹配格式: #72480 框架协议导入-崔正华 https://...
                // 或者从URL中提取任务信息

                // 方法1: 尝试从URL路径中提取任务ID
                // 例如: /task/QGTJmPVYqMYfCdRb
                const taskMatch = url.match(/\/task\/([A-Za-z0-9]+)/);

                // 方法2: 尝试从文本中提取 #编号 和 任务名称
                // 例如: #72480 框架协议导入-崔正华
                const hashMatch = url.match(/#(\d+)\s+([^\shttps]+)/);

                if (hashMatch) {
                    return {
                        taskId: hashMatch[1],
                        taskName: hashMatch[2]
                    };
                }

                // 如果URL中包含任务信息，尝试从页面标题或其他地方获取
                // 这里暂时返回null，需要用户手动输入或通过API获取
                if (taskMatch) {
                    console.log('从URL中提取到任务ID:', taskMatch[1]);
                    // 注意：仅从URL无法获取任务名称，需要通过API查询
                    return {
                        taskId: taskMatch[1],
                        taskName: null
                    };
                }

                return null;
            } catch (error) {
                console.error('解析ones链接失败:', error);
                return null;
            }
        }

        /**
         * 根据ones链接自动填充字段
         */
        function autoFillFromOnesLink() {
            const onesLinkInput = document.getElementById('onesLink');
            if (!onesLinkInput) return;

            const url = onesLinkInput.value.trim();
            if (!url) return;

            const parsed = parseOnesLink(url);
            if (!parsed) {
                console.log('无法从链接中解析出任务信息');
                return;
            }
            console.log('解析结果:', parsed);

            // 填充编号
            if (parsed.taskId) {
                const dynamicNoInput = document.getElementById('dynamicNo');
                if (dynamicNoInput) {
                    dynamicNoInput.value = parsed.taskId;
                    console.log('已填充编号:', parsed.taskId);

                    // 清除该字段的错误样式
                    clearFieldError(dynamicNoInput, 'error_dynamicNo');
                }
            }

           // 填充操作备注
            if (parsed.taskName) {
                const opsRemarkInput = document.getElementById('ops_remark');
                if (opsRemarkInput) {
                    opsRemarkInput.value = parsed.taskId + ' ' + parsed.taskName;
                    console.log('已填充操作备注:', parsed.taskId + ' ' + parsed.taskName);

                    // 清除该字段的错误样式
                    clearFieldError(opsRemarkInput, 'error_ops_remark');
                }
            }

            // 文件名使用动态表单的名称
            const formNameElement = document.getElementById('formName');
            if (formNameElement && dynamicTableConfig) {
                const filePrefixInput = document.getElementById('filePrefix');
                if (filePrefixInput) {
                    filePrefixInput.value = dynamicTableConfig.formName;
                    console.log('已填充文件名:', dynamicTableConfig.formName);

                    // 清除该字段的错误样式
                    clearFieldError(filePrefixInput, 'error_filePrefix');
                }
            }
        }


        /**
         * 获取所有输入框的值（全局方法）
         */
        window.getAllFormValues = function () {
            var result = {};
            var $ = layui.$;

            // 1. 获取查询字段的值（动态生成的）
            gQueryItems.forEach(function (item) {
                // 为查询字段生成唯一的 ID，格式：query_bindingKey_tableName
                const tableName = item.connectedTable && item.connectedTable.length > 0 
                    ? item.connectedTable[0] 
                    : '';
                const queryId = tableName ? `query_${item.bindingKey}_${tableName}` : `query_${item.bindingKey}`;
                const queryVal = ($('#' + queryId).val() || '').trim();

                // 为查询字段生成唯一的键，格式：bindingKey_tableName
                const uniqueKey = tableName ? `${item.bindingKey}_${tableName}` : item.bindingKey;

                result[uniqueKey] = {
                    label: item.label,
                    value: queryVal,
                    inputType: 'query',
                    fieldType: item.type,
                    ValidRule: item.ValidRule,
                    bindingKey: item.bindingKey,  // 保留原始 bindingKey
                    connectedTable: item.connectedTable  // 保留关联表信息
                };
            });

            // 2. 获取公用字段的值（硬编码的三个输入框）
            // 文件名
            const filePrefixVal = ($('#filePrefix').val() || '').trim();
            result['filePrefix'] = {
                value: filePrefixVal,
                inputType: 'common',
                fieldType: 'text'
            };

            // OnesLink
            const onesLinkVal = ($('#onesLink').val() || '').trim();
            result['onesLink'] = {
                value: onesLinkVal,
                inputType: 'common',
                fieldType: 'text'
            };

            // 动态编号
            const dynamicNoVal = ($('#dynamicNo').val() || '').trim();
            result['dynamicNo'] = {
                value: dynamicNoVal,
                inputType: 'common',
                fieldType: 'text'
            };

            // 操作备注
            const opsRemarkVal = ($('#ops_remark').val() || '').trim();
            result['ops_remark'] = {
                value: opsRemarkVal,
                inputType: 'common',
                fieldType: 'text'
            };


            // 3. 获取下拉框的值
            gSelectItems.forEach(function (item) {
                const newId = `new${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;
                const originId = `origin${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;

                // 使用 jQuery 直接获取 select 的选中值
                const newVal = ($('#' + newId).val() || '').trim();
                const originVal = ($('#' + originId).val() || '').trim();

                {#console.log("newId", newId);#}
                {#console.log("newVal", newVal);#}
                {#console.log("originVal", originVal);#}

                result[item.bindingKey] = {
                    label: item.label,
                    newValue: newVal,
                    originValue: originVal,
                    inputType: 'select',
                    newValidRule: item.newValidRule,
                    originValidRule: item.originValidRule
                };
            });


            // 4. 获取单选框的值
            gRadioItems.forEach(function (item) {
                const newId = `new${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;
                const originId = `origin${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;

                // 获取选中的单选框值（新值）
                const checkedRadio = $('input[name="' + newId + '"]:checked');
                const newVal = checkedRadio.length > 0 ? (checkedRadio.val() || '').trim() : '';
                
                // 原值从只读输入框中获取（已经由 handleRadioChange 自动更新）
                const originVal = ($('#' + originId).val() || '').trim();

                result[item.bindingKey] = {
                    label: item.label,
                    newValue: newVal,
                    originValue: originVal,
                    inputType: 'radio',
                    newValidRule: item.newValidRule
                };
            });

            // 5. 获取普通输入框的值（包括数值、文本、日期）
            gNumberInputItems.concat(gTextInputItems).concat(gDateInputItems).forEach(function (item) {
                const newId = `new${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;
                const originId = `origin${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;

                const newVal = ($('#' + newId).val() || '').trim();
                const originVal = ($('#' + originId).val() || '').trim();

                // 为每个字段生成唯一的键，格式：bindingKey_tableName
                // 如果关联多个表，使用第一个表名
                const tableName = item.connectedTable && item.connectedTable.length > 0 
                    ? item.connectedTable[0] 
                    : '';
                const uniqueKey = tableName ? `${item.bindingKey}_${tableName}` : item.bindingKey;

                result[uniqueKey] = {
                    label: item.label,
                    newValue: newVal,
                    originValue: originVal,
                    inputType: item.type,
                    fieldType: item.inputType,
                    newValidRule: item.newValidRule,
                    originValidRule: item.originValidRule,
                    bindingKey: item.bindingKey,  // 保留原始 bindingKey
                    connectedTable: item.connectedTable  // 保留关联表信息
                };
            });


            // 6. 获取补充框的值
            gSupplementItems.forEach(function (item) {
                const mainNewId = `newMain${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;
                const mainOriginId = `originMain${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}`;

                const mainNewVal = ($('#' + mainNewId).val() || '').trim();
                const mainOriginVal = ($('#' + mainOriginId).val() || '').trim();

                // 只有当原值有值时，才传输该补充框的数据
                if (mainOriginVal) {
                    // 为补充框生成唯一的键
                    const tableName = item.connectedTable && item.connectedTable.length > 0 
                        ? item.connectedTable[0] 
                        : '';
                    const uniqueKey = tableName ? `${item.bindingKey}_${tableName}` : item.bindingKey;

                    // 存储主输入框的值
                    result[uniqueKey] = {
                        label: item.label,
                        newValue: mainNewVal,
                        originValue: mainOriginVal,
                        inputType: 'supplement',
                        fieldType: 'supplement',
                        bindingKey: item.bindingKey,
                        connectedTable: item.connectedTable
                    };

                    // 存储每个子输入框的值（使用独立的 bindingKey）
                    item.subFields.forEach((subField, index) => {
                        const subNewId = `newSub${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}_${index}`;
                        const subOriginId = `originSub${item.bindingKey.charAt(0).toUpperCase() + item.bindingKey.slice(1)}_${index}`;

                        const subNewVal = ($('#' + subNewId).val() || '').trim();
                        const subOriginVal = ($('#' + subOriginId).val() || '').trim();

                        result[subField.bindingKey] = {
                            newValue: subNewVal,
                            originValue: subOriginVal,
                            inputType: 'supplement-sub',
                            fieldType: 'supplement-sub',
                            parentKey: uniqueKey  // 使用唯一键作为父键
                        };
                    });
                }
            });

            return result;
        };

        /**
         * 获取查询字段的值（单独的方法）
         */
        window.getQueryFieldValues = function () {
            var result = {};
            var $ = layui.$;

            // 获取动态生成的查询字段
            gQueryItems.forEach(function (item) {
                // 为查询字段生成唯一的 ID，格式：query_bindingKey_tableName
                const tableName = item.connectedTable && item.connectedTable.length > 0 
                    ? item.connectedTable[0] 
                    : '';
                const queryId = tableName ? `query_${item.bindingKey}_${tableName}` : `query_${item.bindingKey}`;
                
                // 为查询字段生成唯一的键，格式：bindingKey_tableName
                const uniqueKey = tableName ? `${item.bindingKey}_${tableName}` : item.bindingKey;
                
                result[uniqueKey] = {
                    label: item.label,
                    value: ($('#' + queryId).val() || '').trim(),
                    inputType: 'query',
                    fieldType: item.type,
                    ValidRule: item.ValidRule,
                    bindingKey: item.bindingKey,  // 保留原始 bindingKey
                    connectedTable: item.connectedTable  // 保留关联表信息
                };
            });

            // 获取硬编码的公用字段
            result['filePrefix'] = ($('#filePrefix').val() || '').trim();
            result['onesLink'] = ($('#onesLink').val() || '').trim();
            result['dynamicNo'] = ($('#dynamicNo').val() || '').trim();
            result['ops_remark'] = ($('#ops_remark').val() || '').trim();

            console.log('查询字段值:', result);
            return result;
        };


        /**
         * 补充框输入处理（带防抖）
         * @param {string} bindingKey - 绑定键
         * @param {HTMLElement} element - 输入框元素
         * @param {string} valueType - 'newValue' 或 'originValue'
         */
        const supplementInputTimers = {};
        
        window.handleSupplementInput = function (bindingKey, element, valueType) {
            const value = element.value;
            const isOriginValue = valueType === 'originValue';
            
            console.log('=== 补充框输入 ===');
            console.log('bindingKey:', bindingKey);
            console.log('value:', value);
            console.log('valueType:', valueType);
            console.log('是否为原值输入框:', isOriginValue);
            
            // 如果值为空，立即清空中字段
            if (!value || value.trim() === '') {
                console.log('值为空，清空中字段');
                clearSupplementSubFields(bindingKey, isOriginValue);
                return;
            }
            
            // 清除之前的定时器
            const timerKey = `${bindingKey}_${valueType}`;
            if (supplementInputTimers[timerKey]) {
                clearTimeout(supplementInputTimers[timerKey]);
            }
            
            // 设置新的定时器，1000ms 后触发查询（增加延迟，避免频繁查询）
            supplementInputTimers[timerKey] = setTimeout(() => {
                console.log('防抖触发查询');
                supplementContainerChange(bindingKey, element);
            }, 500);
        };
        
        /**
         * 清空补充框的子字段
         * @param {string} bindingKey - 主字段的 bindingKey
         * @param {boolean} isOriginValue - 是否为原值
         */
        function clearSupplementSubFields(bindingKey, isOriginValue) {
            const supplementItem = gSupplementItems.find(item => item.bindingKey === bindingKey);
            if (!supplementItem) {
                return;
            }
            
            supplementItem.subFields.forEach((subField, index) => {
                const subId = isOriginValue 
                    ? `originSub${bindingKey.charAt(0).toUpperCase() + bindingKey.slice(1)}_${index}`
                    : `newSub${bindingKey.charAt(0).toUpperCase() + bindingKey.slice(1)}_${index}`;
                
                const subInput = document.getElementById(subId);
                if (subInput) {
                    subInput.value = '';
                    console.log('已清空中字段:', subId);
                    
                    // 清除错误样式
                    const errorElement = document.getElementById(`error_${subId}`);
                    if (errorElement) {
                        errorElement.remove();
                    }
                    subInput.style.borderColor = '';
                    subInput.style.boxShadow = '';
                    subInput.style.backgroundColor = '';
                }
            });
        }


        /**
         * 处理补充框值变化的全局函数
         * @param {string} bindingKey - 绑定键
         * @param {HTMLElement} element - 触发事件的元素
         */
        window.supplementContainerChange = function (bindingKey, element) {
            const value = element.value;
            const fieldType = element.getAttribute('data-field-type');

            // 新查询开始前，先关闭之前未关闭的弹出表格
            if (typeof layui !== 'undefined' && tableLayerIndex !== null) {
                layui.layer.close(tableLayerIndex);
                tableLayerIndex = null;
                window.currentTableLayerIndex = null;
                layui.$(document).off('keydown.tablePicker');
                layui.$(document).off('mousemove.tablePickerDrag');
                layui.$(document).off('mouseup.tablePickerDrag');
            }

            // 直接开始查询
            startSupplementQuery(bindingKey, element, value, fieldType);
        };

        /**
         * 执行补充框查询逻辑（抽离为独立函数）
         */
        function startSupplementQuery(bindingKey, element, value, fieldType) {
            console.log('bindingKey:', bindingKey);
            console.log('value:', value);
            console.log('fieldType:', fieldType);
            console.log('element.id:', element.id);
            console.log('是否为原值输入框:', element.id.startsWith('originMain'));

            // 记录当前激活的输入框
            currentActiveInput = {
                bindingKey: bindingKey,
                element: element,
                fieldType: fieldType
            };

            // 如果值为空，不显示弹出框
            if (!value || value.trim() === '') {
                console.log('值为空，不显示弹出框');
                return;
            }

            // 获取当前补充框的配置项
            const currentSupplementItem = gSupplementItems.find(item => item.bindingKey === bindingKey);

            if (!currentSupplementItem) {
                console.error('未找到对应的补充框配置:', bindingKey);
                return;
            }
            
            // 检查配置是否完整
            if (!currentSupplementItem.mainTable || !currentSupplementItem.mainField) {
                console.error('补充框配置不完整：缺少主表或主字段', currentSupplementItem);
                return;
            }

            // 确定主字段名称（支持配置或默认）
            const mainField = currentSupplementItem.mainField || 'main_value';
            
            // 先查询数据，判断是否需要弹出表格
            const isOriginInput = element.id.startsWith('originMain');
            querySupplementData(currentSupplementItem, value, isOriginInput).then(function(resultData) {
                if (resultData && resultData.length === 1) {
                    // 只有一条数据，直接填充，不弹出表格
                    console.log('只查到一条数据，直接填充:', resultData[0]);
                    fillInputWithData(resultData[0], currentSupplementItem, element);
                } else {
                    // 多条或无数据，弹出表格选择器
                    console.log('查到 ' + (resultData ? resultData.length : 0) + ' 条数据，弹出表格选择框');
                    showTablePicker(bindingKey, value, fieldType);
                }
            }).catch(function(error) {
                console.error('查询失败，弹出表格选择框:', error);
                showTablePicker(bindingKey, value, fieldType);
            });
        };


        /**
         * 收集补充框的辅助字段值（用于联合精确查询）
         * @param {Object} supplementItem - 补充框配置项
         * @param {boolean} isOrigin - 是否收集原值
         * @returns {Array} 辅助字段查询条件数组 [{dbField, value}]
         */
        function collectAuxiliaryValues(supplementItem, isOrigin) {
            const auxiliaryValues = [];
            if (!supplementItem.subFields) return auxiliaryValues;

            supplementItem.subFields.forEach((subField, index) => {
                const subType = subField.type || 'normal';
                if (subType !== 'auxiliary') return;

                const inputId = isOrigin
                    ? `originSub${supplementItem.bindingKey.charAt(0).toUpperCase() + supplementItem.bindingKey.slice(1)}_${index}`
                    : `newSub${supplementItem.bindingKey.charAt(0).toUpperCase() + supplementItem.bindingKey.slice(1)}_${index}`;
                const input = document.getElementById(inputId);
                const value = input ? (input.value || '').trim() : '';
                const dbField = subField.dbField || subField.bindingKey;

                if (value && dbField) {
                    auxiliaryValues.push({ dbField: dbField, value: value });
                }
            });

            return auxiliaryValues;
        }

        function querySupplementData(supplementItem, searchValue, isOrigin) {
            return new Promise((resolve, reject) => {
                const tableName = supplementItem.mainTable;
                const mainField = supplementItem.mainField;
                const subFields = supplementItem.subFields || [];

                if (!tableName || !mainField) {
                    console.error('补充框配置不完整：缺少表名或主字段');
                    resolve([]);
                    return;
                }

                // 收集辅助字段查询条件
                const auxiliaryValues = collectAuxiliaryValues(supplementItem, isOrigin);

                // 快速检查模式：只查 LIMIT 2，判断是否只有1条数据
                fetch('/api/supplement/query/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tableName: tableName,
                        mainField: mainField,
                        subFields: subFields,
                        searchValue: searchValue || '',
                        auxiliaryValues: auxiliaryValues,
                        quickCheck: true  // 快速检查模式，只查 LIMIT 2
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            resolve(data.data);
                        } else {
                            reject(new Error(data.message));
                        }
                    })
                    .catch(error => {
                        reject(error);
                    });
            });
        }


        /**
         * 显示表格选择器（类似日期选择器的效果）
         * @param {string} bindingKey - 当前编辑的字段绑定键
         * @param {string} currentValue - 当前值
         * @param {string} fieldType - 字段类型
         * @param {Array} data - 表格数据（可选，默认使用 mockData）
         */
        window.showTablePicker = function (bindingKey, currentValue, fieldType, data) {
            console.log('=== showTablePicker 被调用 ===');
            console.log('bindingKey:', bindingKey);
            console.log('currentActiveInput:', currentActiveInput);

            // 确保 Layui 已加载
            if (typeof layui === 'undefined') {
                console.error('Layui 未加载!');
                return;
            }

            var $ = layui.$;
            var table = layui.table;
            var layer = layui.layer;

            console.log('layui 组件状态:', {
                $: !!$,
                table: !!table,
                layer: !!layer
            });

            if (!table) {
                console.error('Layui table 模块未加载！请使用 layui.use(["table", "layer"], ...) 加载');
                alert('表格模块未加载，请检查控制台错误');
                return;
            }

            if (!layer) {
                console.error('Layui layer 模块未加载！');
                alert('弹出层模块未加载');
                return;
            }

            // 外部已关闭旧弹出层，此处无需再关
            // 根据当前编辑的字段动态生成表头
            var currentSupplementItem = gSupplementItems.find(item => item.bindingKey === bindingKey);

            console.log('currentSupplementItem:', currentSupplementItem);

            if (!currentSupplementItem) {
                console.error('未找到对应的补充框配置:', bindingKey);
                return;
            }

            // 确定主字段名称
            const mainField = currentSupplementItem.mainField || 'main_value';

            // 构建表头：主输入框 + 子输入框的 label
            var colsConfig = [
                {type: 'radio', width: 50, title: '选择', fixed: true}
            ];

            // 添加主输入框列 - 使用配置的主字段
            colsConfig.push({
                field: mainField,
                title: currentSupplementItem.label,
                minWidth: 120,
                sort: true
            });

            // 添加子输入框列 - 动态遍历子字段配置
            currentSupplementItem.subFields.forEach(subField => {
                colsConfig.push({
                    field: subField.dbField || subField.bindingKey,
                    title: subField.label,
                    minWidth: 100,
                    sort: true
                });
            });

            console.log('colsConfig:', colsConfig);

            // 使用全局变量 currentActiveInput 中的 element
            var element = currentActiveInput.element;

            if (!element) {
                console.error('element 为空!');
                return;
            }

            // 获取"提交"按钮的位置
            var submitButton = document.querySelector('button[onclick="submit()"]');
            var buttonRect = submitButton ? submitButton.getBoundingClientRect() : null;

            // 获取输入框相对于视口的位置
            var rect = element.getBoundingClientRect();

            console.log('输入框位置:', {
                top: rect.top,
                left: rect.left,
                bottom: rect.bottom,
                right: rect.right,
                width: rect.width,
                height: rect.height
            });

            if (buttonRect) {
                console.log('按钮位置:', {
                    top: buttonRect.top,
                    bottom: buttonRect.bottom
                });
            }

            // 估算表格高度（每行约 38px，最多显示 5 行）
            var estimatedTableHeight = 5 * 38 + 40;
            var popupHeight = estimatedTableHeight + 10;
            // 根据列数计算合适的弹出层宽度
            // radio列50px + 主字段列~150px + 子字段列每列~120px + 内边距
            var colCount = colsConfig.length;
            var calculatedWidth = 50 + 150 + (colCount - 2) * 120 + 40;  // 40为padding等
            popupWidth = Math.max(Math.min(calculatedWidth, 800), 400);

            // 计算下方可用空间（考虑按钮位置）
            var windowHeight = window.innerHeight;
            var maxBottom = buttonRect ? buttonRect.top - 10 : windowHeight - 10;
            var spaceBelow = maxBottom - rect.bottom - 5;
            var spaceAbove = rect.top - 10;

            console.log('空间计算:', {
                windowHeight: windowHeight,
                maxBottom: maxBottom,
                spaceBelow: spaceBelow,
                spaceAbove: spaceAbove,
                popupHeight: popupHeight
            });

            // 决定弹出方向：优先向下，空间不足时向上
            var top = rect.bottom + 5;
            var left = rect.left;

            if (spaceBelow < popupHeight && spaceAbove >= popupHeight) {
                top = rect.top - popupHeight - 5;
                console.log('向下空间不足（会遮挡按钮），改为向上弹出');
            } else if (spaceBelow < popupHeight && spaceAbove < popupHeight) {
                console.log('上下空间都不足，保持向下弹出（表格将显示滚动条）');
            } else {
                console.log('向下弹出');
            }

            // 检查右侧空间
            var viewportWidth = window.innerWidth;
            var spaceRight = viewportWidth - rect.left;

            if (spaceRight < popupWidth) {
                left = viewportWidth - popupWidth - 10;
                console.log('向右空间不足，调整为靠左对齐');
            }

            console.log('弹出层位置:', {top: top, left: left});

            // 创建临时容器（包含顶部搜索框）
            var tempId = 'tablePicker_' + new Date().getTime();
            var containerHtml = '<div id="' + tempId + '" style="padding: 10px;background: white;">' +
                '<div style="margin-bottom: 10px;padding: 5px;border-bottom: 1px solid #eee;">' +
                '<input type="text" id="searchInput_' + bindingKey + '" placeholder="请输入关键词进行二次搜索..." class="layui-input" style="height: 32px;line-height: 32px;" />' +
                '</div>' +
                '<table class="layui-hide" id="ID-table-picker-' + bindingKey + '" lay-filter="tablePickerFilter"></table>' +
                '</div>';

            console.log('containerHtml:', containerHtml);

            // 使用 layer.open 创建弹出层
            tableLayerIndex = layer.open({
                type: 1,
                title: '数据选择',
                content: containerHtml,
                area: [popupWidth + 'px', 'auto'],
                offset: [top + 'px', left + 'px'],
                shade: false,
                closeBtn: 1,
                move: false,  // 不使用 Layui 内置拖拽，改用自定义实现
                resize: false,
                zIndex: 999999,
                scrollbar: false,
                background: '#FFFFFF',
                fixed: false,  // fixed:false 才能让 offset 像素定位生效并可拖拽
                success: function (layero, index) {
                    console.log('弹出层打开成功，layero:', layero);

                    window.currentTableLayerIndex = index;

                    $(layero).css({
                        'background': '#FFFFFF',
                        'border': '1px solid #ddd',
                        'box-shadow': '0 2px 8px rgba(0,0,0,0.15)',
                        'z-index': '999999'
                    });

                    // 自定义拖拽功能：通过标题栏拖拽移动弹出层
                    var titleBar = layero.find('.layui-layer-title');
                    if (titleBar.length) {
                        titleBar.css('cursor', 'move');
                        var dragStartX, dragStartY, layerStartLeft, layerStartTop;
                        var isDragging = false;

                        titleBar.on('mousedown', function(e) {
                            isDragging = true;
                            dragStartX = e.clientX;
                            dragStartY = e.clientY;
                            layerStartLeft = parseInt(layero.css('left')) || 0;
                            layerStartTop = parseInt(layero.css('top')) || 0;
                            e.preventDefault();
                        });

                        $(document).on('mousemove.tablePickerDrag', function(e) {
                            if (!isDragging) return;
                            var dx = e.clientX - dragStartX;
                            var dy = e.clientY - dragStartY;
                            layero.css({
                                'left': (layerStartLeft + dx) + 'px',
                                'top': (layerStartTop + dy) + 'px'
                            });
                        });

                        $(document).on('mouseup.tablePickerDrag', function(e) {
                            isDragging = false;
                        });
                    }

                    // 使用服务端分页
                    table.render({
                        elem: '#ID-table-picker-' + bindingKey,
                        cols: [colsConfig],
                        url: '/api/supplement/query/',
                        method: 'post',
                        where: {
                            tableName: currentSupplementItem.mainTable,
                            mainField: mainField,
                            subFields: JSON.stringify(currentSupplementItem.subFields || []),
                            searchValue: currentValue,
                            auxiliaryValues: JSON.stringify(collectAuxiliaryValues(currentSupplementItem, currentActiveInput && currentActiveInput.element && currentActiveInput.element.id.startsWith('originMain'))),
                            isExactSearch: false  // 初始为模糊搜索
                        },
                        request: {
                            pageName: 'page',
                            limitName: 'limit'
                        },
                        response: {
                            statusName: 'success',
                            statusCode: true,
                            dataName: 'data',
                            countName: 'count'
                        },
                        page: true,
                        limit: 5,
                        limits: [5, 10, 15, 20, 50],
                        autoSort: true,
                        skin: 'line',
                        even: true,
                        size: 'sm',

                                $(layero).css('z-index', '999999');

                    // 保存初始模糊搜索值，用于清空二次搜索时恢复
                    window.initialSearchValue = currentValue;

                    // ESC 键关闭弹出层
                    $(document).on('keydown.tablePicker', function(e) {

                            tableLayerIndex = null;

                        // 防抖500ms后重新加载表格

        /**
         * 将表格数据填充到输入框
         * @param {Object} data - 表格行数据
         * @param {Object} supplementItem - 补充框配置项
         * @param {HTMLElement} activeElement - 当前激活的输入框元素（可选）
         */
        function fillInputWithData(data, supplementItem, activeElement) {
            console.log('=== 开始填充数据 ===');
            console.log('data:', data);
            console.log('supplementItem:', supplementItem);
            console.log('activeElement:', activeElement);
            console.log('activeElement.id:', activeElement?.id);

        /**
         * 下载导入模板
         */
        window.downloadTemplate = function () {
            // 显示加载提示
            const loadingIndex = layui.layer.load(2);

            // 发送配置到后端生成 Excel 模板
            axios.post('/api/dynamic/download-template/', {
                config: dynamicTableConfig
            }, {
                responseType: 'blob'  // 重要：指定响应类型为二进制流
            })
                .then(function (response) {
                    layui.layer.close(loadingIndex);

                    // 创建下载链接
                    const blob = new Blob([response.data], {
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                    });
                    // 从 Content-Disposition 头获取文件名
                    const contentDisposition = response.headers['content-disposition'];
                    let filename = '模板.xlsx';

                    if (contentDisposition) {
                        // 尝试匹配 filename* (RFC 5987 标准，UTF-8 编码)
                        const filenameStarMatch = contentDisposition.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
                        if (filenameStarMatch && filenameStarMatch[1]) {
                            filename = decodeURIComponent(filenameStarMatch[1]);
                        } else {
                            // 回退到普通 filename 匹配
                            const filenameMatch = contentDisposition.match(/filename="?([^";]+)"?/);
                            if (filenameMatch && filenameMatch[1]) {
                                filename = decodeURIComponent(filenameMatch[1]);
                            }
                        }
                    }


                    // 触发下载
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);

                    layui.layer.msg('模板下载成功！', {icon: 1});
                })
                .catch(function (error) {
                    layui.layer.close(loadingIndex);
                    console.error('下载失败:', error);

                    let errorMsg = '下载失败';
                    if (error.response) {
                        errorMsg = error.response.data?.message || `服务器错误：${error.response.status}`;
                    } else if (error.request) {
                        errorMsg = '无法连接到服务器';
                    } else {
                        errorMsg = error.message;
                    }

                    layui.layer.msg(errorMsg, {icon: 2});
                });
        };

        /**
         * 根据配置生成在线表格的列定义
         */
        function buildSpreadsheetColumns() {
            const columns = [];
            let colIndex = 0;

            // 1. 查询字段
            const queryItems = dynamicTableConfig.queryItems || [];
            queryItems.forEach(item => {
                columns.push({
                    index: colIndex++,
                    key: item.label,
                    label: item.label,
                    type: item.type || 'text',
                    category: 'query',
                    bindingKey: item.bindingKey,
                    width: 120
                });
            });

            const updateItems = dynamicTableConfig.updateItems || [];

            // 2. 所有更新字段的新值列（按字段排序在前）
            updateItems.forEach(item => {
                const inputType = item.inputType;
                if (inputType === 'calculated') {
                    // 计算字段：不显示在表格中（由后端计算）
                    return;
                }
                if (inputType === 'supplement') {
                    // 补充框主字段新值
                    columns.push({
                        index: colIndex++,
                        key: '新' + item.label,
                        label: '新' + item.label,
                        type: 'text',
                        category: 'update',
                        bindingKey: item.bindingKey,
                        width: 140
                    });
                    // 辅助子字段新值
                    (item.subFields || []).forEach(sub => {
                        const subType = sub.type || 'normal';
                        if (subType === 'normal') return;
                        columns.push({
                            index: colIndex++,
                            key: '新' + sub.label,
                            label: '新' + sub.label,
                            type: 'text',
                            category: 'sub',
                            bindingKey: sub.bindingKey,
                            parentKey: item.bindingKey,
                            width: 120
                        });
                    });
                } else {
                    // 普通更新字段新值
                    columns.push({
                        index: colIndex++,
                        key: '新' + item.label,
                        label: '新' + item.label,
                        type: item.type || 'text',
                        category: 'update',
                        bindingKey: item.bindingKey,
                        width: 120
                    });
                }
            });

            // 3. 所有更新字段的原值列（按字段排序在后）
            updateItems.forEach(item => {
                const inputType = item.inputType;
                if (inputType === 'calculated') {
                    return;
                }
                if (inputType === 'supplement') {
                    // 补充框主字段原值
                    columns.push({
                        index: colIndex++,
                        key: '原' + item.label,
                        label: '原' + item.label,
                        type: 'text',
                        category: 'update',
                        bindingKey: item.bindingKey,
                        width: 140
                    });
                    // 辅助子字段原值
                    (item.subFields || []).forEach(sub => {
                        const subType = sub.type || 'normal';
                        if (subType === 'normal') return;
                        columns.push({
                            index: colIndex++,
                            key: '原' + sub.label,
                            label: '原' + sub.label,
                            type: 'text',
                            category: 'sub',
                            bindingKey: sub.bindingKey,
                            parentKey: item.bindingKey,
                            width: 120
                        });
                    });
                } else {
                    // 普通更新字段原值
                    columns.push({
                        index: colIndex++,
                        key: '原' + item.label,
                        label: '原' + item.label,
                        type: item.type || 'text',
                        category: 'update',
                        bindingKey: item.bindingKey,
                        width: 120
                    });
                }
            });

            return columns;
        }

        /**
         * 将表单名称处理为合法的 Sheet 名称
         * Luckysheet/Excel 限制：不超过 31 字符，不能包含 [ ] : \ ? * /，首尾不能是单引号
         */
        function sanitizeSheetName(name) {
            if (!name) return 'Sheet1';
            let sanitized = String(name)
                .replace(/[\[\]:\\?*\/]/g, '_')
                .replace(/^'+|'+$/g, '')
                .trim();
            if (!sanitized) return 'Sheet1';
            if (sanitized.length > 31) {
                sanitized = sanitized.substring(0, 31);
            }
            return sanitized;
        }

        /**
         * 根据表头文本计算合适的列宽
         * 中文字符按 14px、英文/数字按 8px 估算，加上 24px 边距
         */
        function calculateOptimalColumnWidth(label) {
            if (!label) return 120;
            let textWidth = 0;
            for (const ch of String(label)) {
                // CJK 字符范围
                if (/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch)) {
                    textWidth += 14;
                } else {
                    textWidth += 8;
                }
            }
            return Math.min(Math.max(textWidth + 24, 80), 300);
        }

        /**
         * 获取某一列对应的当前表单默认值
         * @param {Object} col - 列定义
         * @param {Object} allValues - getAllFormValues 的结果
         * @returns {string} 默认值，无则返回空字符串
         */
        function getColumnDefaultValue(col, allValues) {
            if (!allValues) return '';

            // 查找当前列对应的表单值对象
            let item = allValues[col.bindingKey];
            if (!item) {
                const keys = Object.keys(allValues);
                for (const k of keys) {
                    if (k.startsWith(col.bindingKey + '_')) {
                        item = allValues[k];
                        break;
                    }
                }
            }
            if (!item) return '';

            if (col.category === 'query') {
                return item.value || '';
            } else if (col.category === 'update' || col.category === 'sub') {
                const key = col.key && col.key.startsWith('新') ? 'newValue' : 'originValue';
                return item[key] || '';
            }
            return '';
        }

        /**
         * 批量设置 Luckysheet 单元格值（使用 setRangeValue 二维数组接口，性能优于逐个 setCellValue）
         * @param {Array} rangeValues - 扁平数组，元素格式 {r, c, v}
         */
        function batchSetRangeValues(rangeValues) {
            if (!rangeValues || rangeValues.length === 0) return;

            // 优先使用 setRangeValue(range, data) 批量写入
            if (typeof luckysheet.setRangeValue === 'function') {
                try {
                    let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
                    rangeValues.forEach(item => {
                        minR = Math.min(minR, item.r);
                        maxR = Math.max(maxR, item.r);
                        minC = Math.min(minC, item.c);
                        maxC = Math.max(maxC, item.c);
                    });

                    const rowCount = maxR - minR + 1;
                    const colCount = maxC - minC + 1;
                    const data = [];
                    for (let r = 0; r < rowCount; r++) {
                        const row = [];
                        for (let c = 0; c < colCount; c++) {
                            row.push('');
                        }
                        data.push(row);
                    }

                    rangeValues.forEach(item => {
                        data[item.r - minR][item.c - minC] = item.v;
                    });

                    const range = {
                        row: [minR, maxR],
                        column: [minC, maxC]
                    };

                    luckysheet.setRangeValue(data, { range: range, isRefresh: true });
                    return;
                } catch (e) {
                    console.warn('[WARN] setRangeValue 批量写入失败，回退到 setCellValue:', e);
                }
            }

            // 回退：逐个写入
            rangeValues.forEach(item => {
                luckysheet.setCellValue(item.r, item.c, item.v);
            });
        }

        /**
         * 处理在线编辑器的文件导入
         */
        window.handleXsFileImport = function (input) {
            const file = input.files[0];
            if (!file) return;
            input.value = '';

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    if (jsonData.length === 0) {
                        layui.layer.msg('文件为空', {icon: 2});
                        return;
                    }

                    // 第一行作为表头，匹配列
                    const fileHeaders = jsonData[0].map(h => String(h).trim());
                    const colMap = {}; // fileColIndex -> luckyColIndex
                    fileHeaders.forEach((h, fileIdx) => {
                        const luckyCol = luckyColumns.find(c => c.label === h || c.key === h);
                        if (luckyCol) {
                            colMap[fileIdx] = luckyCol.index;
                        }
                    });

                    console.log('[DEBUG] fileHeaders:', fileHeaders);
                    console.log('[DEBUG] colMap:', colMap);

                    // 清空现有数据（保留表头）
                    clearSpreadsheetData();

                    // 批量构建待写入的单元格数据
                    const rangeValues = [];
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        row.forEach((cell, fileIdx) => {
                            if (colMap[fileIdx] !== undefined && cell !== '' && cell !== null && cell !== undefined) {
                                rangeValues.push({
                                    r: i,
                                    c: colMap[fileIdx],
                                    v: String(cell)
                                });
                            }
                        });
                    }

                    // 使用批量写入提升性能
                    batchSetRangeValues(rangeValues);

                    layui.layer.msg(`数据导入成功，共 ${jsonData.length - 1} 行`, {icon: 1});
                } catch (err) {
                    console.error('导入失败:', err);
                    layui.layer.msg('文件解析失败：' + err.message, {icon: 2});
                }
            };
            reader.readAsArrayBuffer(file);
        };

        /**
         * 清空在线编辑器数据
         */
        window.clearSpreadsheetData = function () {
            if (!luckySheetReady || typeof luckysheet === 'undefined') {
                layui.layer.msg('表格尚未就绪，请稍后再试', {icon: 2});
                return;
            }

            // 获取当前sheet的数据范围
            const sheetData = luckysheet.getSheetData();
            const rowCount = sheetData.length;
            const colCount = luckyColumns.length;

            // 批量构建待清空的单元格数据
            const rangeValues = [];
            for (let r = 1; r < rowCount; r++) {
                for (let c = 0; c < colCount; c++) {
                    rangeValues.push({ r: r, c: c, v: '' });
                }
            }

            // 使用批量写入提升性能
            batchSetRangeValues(rangeValues);

            layui.layer.msg('已清空数据', {icon: 1});
        };

        /**
         * 将已保存的在线编辑数据回显到 Luckysheet
         */
        function fillSavedOnlineRows() {
            if (!luckySheetReady || typeof luckysheet === 'undefined') {
                layui.layer.msg('表格尚未就绪，请稍后再试', {icon: 2});
                return;
            }
            if (!savedOnlineRows || savedOnlineRows.length === 0) {
                return;
            }

            savedOnlineRows.forEach((row, rowIndex) => {
                const sheetRow = rowIndex + 1; // 第 0 行是表头
                luckyColumns.forEach(col => {
                    if (row[col.key] !== undefined && row[col.key] !== null && String(row[col.key]).trim() !== '') {
                        luckysheet.setCellValue(sheetRow, col.index, String(row[col.key]));
                    }
                });
            });

            if (!luckySheetReady || typeof luckysheet === 'undefined') return;
            const errorColIndex = luckyColumns.length;
            const sheetData = luckysheet.getSheetData();
            const rowCount = sheetData.length;
            for (let r = 0; r < rowCount; r++) {
                luckysheet.setCellValue(r, errorColIndex, '');
            }
        }

        /**
         * 将后端返回的行级校验错误填充到 Luckysheet 的错误列
         * @param {Array} rowErrors - 后端返回的错误数组，元素格式 {rowIndex, failReason}
         */
        function fillValidationErrors(rowErrors) {
            if (!luckySheetReady || typeof luckysheet === 'undefined') return;
            if (!rowErrors || rowErrors.length === 0) return;

            const errorColIndex = luckyColumns.length;

            // 设置错误列表头
            luckysheet.setCellValue(0, errorColIndex, {
                v: '错误信息',
                ct: { fa: 'General', t: 'g' },
                m: '错误信息',
                bg: '#ffcccc',
                ff: 'Arial',
                fs: 12,
                bl: 1,
                ht: 0,
                vt: 0
            });

            // 设置错误列宽度
            if (typeof luckysheet.setColumnWidth === 'function') {
                luckysheet.setColumnWidth([{ col: errorColIndex, len: 280 }]);
            } else {
                const config = luckysheet.getConfig ? luckysheet.getConfig() : {};
                if (config && config.columnlen) {
                    config.columnlen[errorColIndex] = 280;
                }
            }

            // 后端 rowIndex 从 2 开始（第 1 行为表头），前端数据行从第 1 行开始
            rowErrors.forEach(function (err) {
                const backendRowIndex = err.rowIndex;
                const frontendRow = backendRowIndex - 1;
                const failReason = err.failReason || '';
                if (frontendRow > 0) {
                    luckysheet.setCellValue(frontendRow, errorColIndex, {
                        v: failReason,
                        ct: { fa: 'General', t: 'g' },
                        m: failReason,
                        bg: '#fff3cd',
                        fc: '#856404',
                        ff: 'Arial',
                        fs: 11,
                        ht: 0,
                        vt: 0
                    });
                }
            });
        }

        /**
         * 从单张 Sheet 的二维数据中提取有效数据行
         * @param {Array} sheetData - 单张 Sheet 的二维数据
         * @returns {Array} 提取后的数据行数组
         */
        function extractRowsFromSheet(sheetData) {
            const rows = [];
            if (!sheetData || !Array.isArray(sheetData)) {
                return rows;
            }

            // 提取数据行（跳过表头第0行）
            for (let r = 1; r < sheetData.length; r++) {
                const row = sheetData[r];
                if (!row) continue;

                const rowObj = {};
                let hasData = false;

                for (let c = 0; c < luckyColumns.length; c++) {
                    const cell = row[c];
                    const colDef = luckyColumns[c];

                    // Luckysheet cell format: { v: value, m: displayValue, ... }
                    let cellValue = '';
                    if (cell && typeof cell === 'object') {
                        cellValue = cell.v !== undefined ? cell.v : (cell.m !== undefined ? cell.m : '');
                    } else if (cell !== undefined && cell !== null) {
                        cellValue = cell;
                    }

                    if (cellValue !== undefined && cellValue !== null && String(cellValue).trim() !== '') {
                        rowObj[colDef.key] = String(cellValue).trim();
                        hasData = true;
                    }
                }

                if (hasData) {
                    rows.push(rowObj);
                }
            }
            return rows;
        }

        /**
         * 保存在线编辑的数据到内存，不提交到后端
         */
        window.saveOnlineEditorData = function () {

            }

            // 清空错误信息列，避免旧错误随数据一起保存
            clearErrorColumn();

            // 如果已选择文件导入，清空它，改用在线编辑数据
            if (batchImportFile) {
                batchImportFile = null;
                document.getElementById('batchImportFile').value = '';

                layui.layer.msg('已清空文件导入选择，改用在线编辑数据', {icon: 0});
            }

            // 获取所有工作表数据
            let allSheets = [];
            try {
                allSheets = luckysheet.getAllSheets ? luckysheet.getAllSheets() : [{

                }];

                return;
            }
            console.log('[DEBUG] saveOnlineEditorData allSheets:', allSheets);

            // 汇总所有 Sheet 中的有效数据行
            const dataRows = [];
            allSheets.forEach(function (sheet) {
                const sheetData = sheet && sheet.data ? sheet.data : sheet;

        /**
         * HTML 转义，防止预览表格 XSS
         */
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /**
         * 提交在线批量导入数据
         */
        function submitOnlineBatchImport(dataRows) {
            const loadingIndex = layui.layer.load(2);
            const queryValues = window.getQueryFieldValues();

            axios.post('/api/dynamic/batch-import/', {
                config: dynamicTableConfig,
                queryValues: queryValues,
                rows: dataRows
            }, {
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(function (response) {
                    layui.layer.close(loadingIndex);

                    if (response.data.success) {
                        const failCount = response.data.failCount || 0;
                        const rowErrors = response.data.rowErrors || [];
                        // 在线编辑模式存在校验失败行时，回显错误列而不是生成错误文件
                        if (failCount > 0 && rowErrors.length > 0) {
                            layui.layer.msg(`校验失败 ${failCount} 行，已回显到在线编辑表格的错误列`, {icon: 2});
                            pendingValidationErrors = rowErrors;
                            openOnlineEditor();
                            return;
                        }
                        showSubmitResult(true, response.data.message || '批量导入完成', {
                            sqlFilePath: response.data.sqlFilePath,
                            excelFilePath: response.data.excelFilePath,
                            totalRows: response.data.totalRows,
                            successCount: response.data.successCount,
                            failCount: response.data.failCount
                        }, true);
                    } else {
                        showSubmitResult(false, response.data.message || '批量导入失败', {
                            excelFilePath: response.data.excelFilePath
                        }, true);
                    }
                })
                .catch(function (error) {
                    layui.layer.close(loadingIndex);
                    console.error('导入失败:', error);

                    clearAllFieldErrors();

                    let errorMsg = '导入失败';
                    let errors = [];

                    if (error.response && error.response.data) {
                        errorMsg = error.response.data.message || '导入失败';
                        errors = error.response.data.errors || [];
                    } else if (error.response) {
                        errorMsg = '服务器错误：' + error.response.status;
                    } else if (error.request) {
                        errorMsg = '无法连接到服务器';
                    } else {
                        errorMsg = error.message;
                    }

                    if (errors.length > 0) {
                        markErrorsToFields(errors);
                    }

                    showSubmitResult(false, errorMsg, {}, true);
                });
        }

            } else {

        /**
         * 为输入框添加错误标记并监听输入事件
         * @param {HTMLElement} element - 输入框元素
         * @param {string} errorId - 错误元素 ID
         * @param {string} errorMessage - 错误信息
         */
        function markAsError(element, errorId, errorMessage) {
            // 设置边框样式
            element.style.borderColor = '#ff4d4f';
            element.style.boxShadow = '0 0 0 2px rgba(255, 77, 79, 0.2)';
            element.style.backgroundColor = '#fff1f0';

            // 添加或更新错误描述
            addOrUpdateError(element, errorId, errorMessage);

            // 监听输入事件，输入时清除错误样式
            const eventType = element.type === 'radio' || element.type === 'checkbox' ? 'change' : 'input';

            // 如果已经有监听器，先移除
            if (element._clearErrorHandler) {
                element.removeEventListener(eventType, element._clearErrorHandler);
            }

            // 创建新的事件监听器
            const clearHandler = function () {
                clearError(element, errorId);
                // 不再移除监听器，让它持续有效
            };

            // 保存监听器引用
            element._clearErrorHandler = clearHandler;

            // 添加事件监听器
            element.addEventListener(eventType, clearHandler);
        }

        /**
         * 在输入框下方添加或更新错误描述
         * @param {HTMLElement} inputElement - 输入框元素（input、select 或 radio）
         * @param {string} errorId - 错误元素 ID
         * @param {string} errorMessage - 错误信息
         */
        function addOrUpdateError(inputElement, errorId, errorMessage) {
            console.log(errorId)
            // 检查是否已存在错误提示
            let errorElement = document.getElementById(errorId);

            if (!errorElement) {
                // 创建错误提示元素
                errorElement = document.createElement('div');
                errorElement.id = errorId;
                errorElement.className = 'form-control-feedback';

                // 设置样式：红色文字、小字号、顶部间距
                errorElement.style.cssText = `
                  display:flex;
                  align-items:center;
                  padding:.375rem .75rem;
                  font-size:1rem;
                  font-weight:400;
                  line-height:1.5;
                  color:red;
                `;

                // 判断是否为下拉框元素
                const isSelect = inputElement.tagName === 'SELECT';

                // 判断是否为单选框元素
                const isRadio = inputElement.type === 'radio';

                if (isSelect) {
                    // 下拉框的特殊处理：找到 layui 渲染的容器
                    const layuiInputInline = inputElement.closest('.layui-input-inline');

                    if (layuiInputInline) {
                        // 在 layui-input-inline 容器后插入错误提示
                        if (layuiInputInline.nextSibling) {
                            layuiInputInline.parentNode.insertBefore(errorElement, layuiInputInline.nextSibling);
                        } else {
                            layuiInputInline.parentNode.appendChild(errorElement);
                        }
                    } else {
                        // 如果没有找到 layui 容器，回退到普通处理
                        const parentGroup = inputElement.closest('.input-group') || inputElement.parentElement;
                        if (parentGroup) {
                            if (inputElement.nextSibling) {
                                parentGroup.insertBefore(errorElement, inputElement.nextSibling);
                            } else {
                                parentGroup.appendChild(errorElement);
                            }
                        }
                    }
                } else if (isRadio) {
                    // 单选框的特殊处理：找到最近的 .input-group 容器
                    const parentGroup = inputElement.closest('.input-group');

                    if (parentGroup) {
                        // 在 .input-group 之后插入错误提示（而不是在其内部）
                        if (parentGroup.nextSibling) {
                            parentGroup.parentNode.insertBefore(errorElement, parentGroup.nextSibling);
                        } else {
                            parentGroup.parentNode.appendChild(errorElement);
                        }
                    } else {
                        // 回退到普通处理
                        const wrapperDiv = inputElement.closest('div[class*="layui-form-radio"]') || inputElement.parentElement;
                        if (wrapperDiv) {
                            if (wrapperDiv.nextSibling) {
                                wrapperDiv.parentNode.insertBefore(errorElement, wrapperDiv.nextSibling);
                            } else {
                                wrapperDiv.parentNode.appendChild(errorElement);
                            }
                        }
                    }
                } else {
                    // 普通输入框的处理逻辑
                    const parentGroup = inputElement.closest('.input-group') || inputElement.parentElement;

                    if (parentGroup) {
                        // 在输入框之后插入错误提示
                        if (inputElement.nextSibling) {
                            parentGroup.insertBefore(errorElement, inputElement.nextSibling);
                        } else {
                            parentGroup.appendChild(errorElement);
                        }
                    } else {
                        // 如果没有找到父容器，直接在输入框后插入
                        if (inputElement.parentNode) {
                            if (inputElement.nextSibling) {
                                inputElement.parentNode.insertBefore(errorElement, inputElement.nextSibling);
                            } else {
                                inputElement.parentNode.appendChild(errorElement);
                            }
                        }
                    }
                }
            }

            // 更新错误信息
            errorElement.textContent = errorMessage;
        }

        /**
