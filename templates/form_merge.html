{% extends "base.html" %}

{% block title %}表单合并工具{% endblock %}

{% block main_content %}
    <div class="container-fluid p-0">
        <h4 class="mb-4">表单合并工具</h4>

        <div class="card">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 1200px">
                        <span class="input-group-text" required>onesLink</span>
                        <input type="text" id="onesLink" class="form-control" placeholder="onesLink">
                    </div>
                </div>
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 500px">
                        <span class="input-group-text">文件名</span>
                        <input type="text" id="filePrefix" class="form-control" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleEdit('filePrefix', this)"
                                title="点击编辑">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 500px">
                        <span class="input-group-text">编号</span>
                        <input type="text" id="dynamicNo" class="form-control" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleEdit('dynamicNo', this)"
                                title="点击编辑">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>
                <div class="row g-3 align-items-center">
                    <div class="input-group mb-3" style="width: 500px">
                        <span class="input-group-text">操作备注</span>
                        <input type="text" id="ops_remark" class="form-control" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleEdit('ops_remark', this)"
                                title="点击编辑">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>

                <!-- 表单选择区域 -->
                <div class="form-selection-section">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                        <h5 class="mb-0"><i class="bi bi-ui-checks-grid me-2"></i>选择要合并的表单</h5>
                    </div>

                    <!-- 已选中标签展示区 -->
                    <div id="selectedTagsContainer" class="selected-tags-panel" style="display: none;">
                        <div class="d-flex align-items-center flex-wrap gap-2 mb-2">
                            <span class="fw-semibold text-primary"><i class="bi bi-check-circle-fill me-1"></i>已选择 <span id="selectedCount">0</span> 个表单</span>
                            <button class="btn btn-sm btn-outline-danger" onclick="clearAllSelection()" title="清除所有选择">
                                <i class="bi bi-x-circle"></i> 清除选择
                            </button>
                        </div>
                        <div id="selectedTags" class="d-flex flex-wrap gap-2">
                            <!-- 动态生成选中标签 -->
                        </div>
                    </div>

                    <!-- 模块标签 + 搜索工具栏 -->
                    <div class="module-tabs-toolbar mb-3">
                        <div class="module-tabs-scroll">
                            <div class="module-tabs" id="moduleTabsList">
                                <!-- 动态生成模块标签 -->
                            </div>
                        </div>
                        <div class="module-search">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="formSearchInput"
                                       placeholder="搜索表单名称或拼音..." oninput="filterForms()">
                                <button class="btn btn-outline-secondary" type="button" onclick="clearFormSearch()">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 表单列表 -->
                    <div id="formSelectionContainer" class="form-list-container">
                        <!-- 动态加载表单列表 -->
                        <div class="text-muted text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2">加载表单列表...</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex align-items-center flex-wrap gap-2 mb-4" id="formActionButtons">
                    <a href="javascript:void(0)" onclick="downloadTemplate()" class="btn btn-outline-primary"
                       id="downloadTemplateBtn">
                        <i class="bi bi-download"></i> 下载导入模板
                    </a>
                    <input type="file" id="batchImportFile" accept=".xlsx" style="display: none;"
                           onchange="handleBatchImportFileSelect(this)">
                    <button type="button" onclick="document.getElementById('batchImportFile').click()"
                            class="btn btn-outline-secondary"
                            id="batchImportBtn">
                        <i class="bi bi-upload"></i> 从文件导入
                    </button>
                    <button type="button" onclick="openOnlineEditor()" class="btn btn-outline-success"
                            id="onlineEditorBtn">
                        <i class="bi bi-table"></i> 在线编辑导入
                    </button>
                    <button type="button" onclick="previewSavedOnlineData()" class="btn btn-outline-primary"
                            id="previewOnlineBtn">
                        <i class="bi bi-eye"></i> 预览已保存数据
                    </button>
                    <span id="batchImportFileName" style="color: #666;"></span>
                    <span id="savedOnlineRowsStatus"></span>
                </div>

                <!-- 在线编辑器容器（Bootstrap 全屏模态框） -->
                <div class="modal fade" id="luckysheetModal" tabindex="-1" aria-labelledby="luckysheetModalLabel" aria-hidden="true" data-bs-focus="false">
                    <div class="modal-dialog modal-fullscreen">
                        <div class="modal-content">
                            <div class="modal-header py-2">
                                <h5 class="modal-title fs-6" id="luckysheetModalLabel">
                                    <i class="bi bi-table me-1"></i>在线编辑导入数据
                                </h5>
                                <div class="d-flex align-items-center gap-2 flex-wrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="importFromFileToOnlineEditor()">
                                        <i class="bi bi-file-earmark-excel"></i> 从Excel导入
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearSpreadsheetData()">
                                        <i class="bi bi-trash"></i> 清空数据
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="previewCurrentOnlineData()">
                                        <i class="bi bi-eye"></i> 预览
                                    </button>
                                    <button type="button" class="btn btn-sm btn-secondary" onclick="closeOnlineEditor()">取消</button>
                                    <button type="button" class="btn btn-sm btn-success" onclick="saveOnlineEditorData()">保存</button>
                                </div>
                            </div>
                            <div class="modal-body p-0" style="overflow: hidden; background: #f5f5f5;">
                                <div id="luckysheet" style="width: 100%; height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 在线编辑数据预览弹窗 -->
                <div class="modal fade" id="onlineDataPreviewModal" tabindex="-1" aria-labelledby="onlineDataPreviewModalLabel" aria-hidden="true" data-bs-focus="false">
                    <div class="modal-dialog modal-xl modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title fs-6" id="onlineDataPreviewModalLabel">
                                    <i class="bi bi-eye me-1"></i>已保存的在线编辑数据
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div id="onlineDataPreviewTable" style="max-height: 60vh; overflow: auto;">
                                    <p class="text-muted">暂无保存的数据</p>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                            </div>
                        </div>
                    </div>
                </div>
                <input type="file" id="xsImportFile" accept=".xlsx" style="display: none;" onchange="handleXsFileImport(this)">

                <!-- 提交结果显示区域 -->
                <div id="submitResultArea" style="display: none; margin-bottom: 20px;">
                    <div class="alert" id="resultAlert" role="alert">
                        <h5 class="alert-heading" id="resultTitle"></h5>
                        <p id="resultMessage"></p>
                        <hr>
                        <div id="resultActions"></div>
                    </div>
                </div>
                <button onclick="submit()" class="layui-btn">提交</button>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/static/js/luckysheet/plugins.css">

    <script>
        /**
         * 切换输入框的编辑状态
         * @param {string} inputId - 输入框ID
         * @param {HTMLElement} button - 按钮元素
         */
        window.toggleEdit = function (inputId, button) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const isReadonly = input.hasAttribute('readonly');

            if (isReadonly) {
                // 切换到编辑状态
                input.removeAttribute('readonly');
                input.focus();

                // 更改按钮图标和提示
                button.innerHTML = '<i class="bi bi-check-lg"></i>';
                button.title = '完成编辑';
                button.classList.remove('btn-outline-secondary');
                button.classList.add('btn-success');

                // 添加失去焦点事件，自动恢复只读
                input.addEventListener('blur', function handler() {
                    toggleEdit(inputId, button);
                    input.removeEventListener('blur', handler);
                }, {once: true});
            } else {
                // 切换到只读状态
                input.setAttribute('readonly', 'readonly');

                // 恢复按钮图标和提示
                button.innerHTML = '<i class="bi bi-pencil-square"></i>';
                button.title = '点击编辑';
                button.classList.remove('btn-success');
                button.classList.add('btn-outline-secondary');
            }
        };

        /**
         * 从ones链接中解析内容
         * @param {string} url - ones链接（可包含 #编号 任务名 和 URL）
         * @returns {Object} 解析结果 {taskId, taskName}
         */
        function parseOnesLink(url) {
            if (!url || typeof url !== 'string') {
                return null;
            }

            try {
                // 把 URL 和前面的文本分开，避免 URL 中的 #/team/... 被误识别
                const urlMatch = url.match(/https?:\/\/\S+/);
                const linkUrl = urlMatch ? urlMatch[0] : '';
                const textPart = urlMatch
                    ? url.substring(0, url.indexOf(linkUrl)).trim()
                    : url.trim();

                // 提取开头的 #编号，支持多个编号用 & / 空格 / # / 中英文逗号分隔
                // 例如: #98835&98732、#123 #456、#123,456
                let taskId = '';
                const numChunkMatch = textPart.match(/^#[\d]+(?:[&，,\s#]*[\d]+)*/);
                if (numChunkMatch) {
                    const digits = numChunkMatch[0].match(/\d+/g);
                    if (digits && digits.length > 0) {
                        taskId = digits.join('&');
                    }
                }

                // 剩余部分作为任务名称，并去掉前导分隔符
                let taskName = textPart.replace(/^#[\d]+(?:[&，,\s#]*[\d]+)*/, '').trim();
                taskName = taskName.replace(/^[-—_/\s]+/, '');

                // 如果文本中没有 #编号，尝试从 URL 路径提取任务ID
                const taskMatch = (linkUrl || url).match(/\/task\/([A-Za-z0-9]+)/);
                if (!taskId && taskMatch) {
                    taskId = taskMatch[1];
                }

                if (!taskId && !taskName) {
                    return null;
                }

                return {
                    taskId: taskId || null,
                    taskName: taskName || null
                };
            } catch (error) {
                console.error('解析ones链接失败:', error);
                return null;
            }
        }

        window.filterForms = function() {
            const searchText = document.getElementById('formSearchInput').value.trim().toLowerCase();
            
            let filtered = formList;
            
            // 先按当前模块标签筛选
            if (currentModuleTab && currentModuleTab !== 'ALL') {
                filtered = filtered.filter(form => form.parent_menu_name === currentModuleTab);
            }
            
            // 再按文本搜索
            if (searchText) {
                filtered = filtered.filter(form => {
                    // 中文匹配
                    if (form.form_name.toLowerCase().includes(searchText)) {
                        return true;
                    }
                    
                    // 拼音匹配
                    const pinyinData = formPinyinMap[form.id];
                    if (pinyinData) {
                        if (pinyinData.full.includes(searchText) || pinyinData.first.includes(searchText)) {
                            return true;
                        }
                    }
                    
                    return false;
                });
            }
            
            renderFormSelection(filtered);
        };

            // 显示加载提示

            // 构建请求数据

                formIds: selectedFormIds,
                filePrefix: document.getElementById('filePrefix').value || 'merge'
            };

            fetch('/api/form-merge/download-template/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestData),
            })
                .then(response => {
                    layui.layer.close(loadingIndex);

                    if (!response.ok) {
                        throw new Error('下载失败');
                    }
                    return response.blob();
                })
                .then(blob => {
                    // 创建下载链接
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = requestData.filePrefix + '_合并模板.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    layui.layer.msg('模板下载成功！', {icon: 1});
                })
                .catch(error => {
                    layui.layer.close(loadingIndex);
                    console.error('Error:', error);
                    layui.layer.msg('下载失败：' + error.message, {icon: 2});
                });

        // ==================== 在线编辑器相关 ====================
        // 全局状态变量在文件顶部已声明，此处不再重复 let/const

        /**
         * 将表单名称处理为合法的 Sheet 名称
         */
        function sanitizeSheetName(name) {
            if (!name) return 'Sheet1';
            let sanitized = String(name)
                .replace(/[\[\]:\\?*\/]/g, '_')
                .replace(/^'+|'+$/g, '')
                .trim();
            if (!sanitized) return 'Sheet1';
            if (sanitized.length > 31) {
                sanitized = sanitized.substring(0, 31);
            }
            return sanitized;
        }

        /**
         * 根据表头文本计算合适的列宽
         */
        function calculateOptimalColumnWidth(label) {
            if (!label) return 120;
            let textWidth = 0;
            for (const ch of String(label)) {
                if (/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch)) {
                    textWidth += 14;
                } else {
                    textWidth += 8;
                }
            }
            return Math.min(Math.max(textWidth + 24, 80), 300);
        }

        /**
         * 根据列定义获取默认值
         */
        function getColumnDefaultValue(col, config) {
            const queryItems = config.queryItems || [];
            const updateItems = config.updateItems || [];

            if (col.category === 'query') {
                const item = queryItems.find(i => i.label === col.key);
                return item && item.defaultValue ? String(item.defaultValue) : '';
            }

            const isNew = col.key && col.key.startsWith('新');
            const baseLabel = isNew ? col.key.substring(1) : col.key.substring(1);
            const parentItem = updateItems.find(i => i.label === baseLabel);
            if (!parentItem) return '';

            if (col.category === 'sub') {
                const sub = (parentItem.subFields || []).find(s =>
                    (isNew ? '新' + (s.label || '') : '原' + (s.label || '')) === col.key
                );
                if (!sub) return '';
                return String(isNew ? (sub.newDefaultValue || sub.defaultValue || '')
                                    : (sub.originDefaultValue || sub.defaultValue || ''));
            }

            return String(isNew ? (parentItem.newDefaultValue || '')
                                : (parentItem.originDefaultValue || ''));
        }

        /**
         * 根据表单配置生成在线表格列定义
         */
        function buildSpreadsheetColumns(config) {
            const columns = [];
            let colIndex = 0;

            const queryItems = config.queryItems || [];
            queryItems.forEach(item => {
                const defaultValue = item.defaultValue ? String(item.defaultValue) : '';
                columns.push({
                    index: colIndex++,
                    key: item.label,
                    label: item.label,
                    type: item.type || 'text',
                    category: 'query',
                    bindingKey: item.bindingKey,
                    width: calculateOptimalColumnWidth(item.label),
                    hasDefault: !!defaultValue,
                    defaultValue: defaultValue
                });
            });

            const updateItems = config.updateItems || [];

            // 所有更新字段的新值列在前
            updateItems.forEach(item => {
                const inputType = item.inputType;
                if (inputType === 'calculated') return;
                const newDefault = item.newDefaultValue ? String(item.newDefaultValue) : '';
                columns.push({
                    index: colIndex++,
                    key: '新' + item.label,
                    label: '新' + item.label,
                    type: 'text',
                    category: 'update',
                    bindingKey: item.bindingKey,
                    width: calculateOptimalColumnWidth('新' + item.label),
                    hasDefault: !!newDefault,
                    defaultValue: newDefault
                });
                if (inputType === 'supplement') {
                    (item.subFields || []).forEach(sub => {
                        const subType = sub.type || 'normal';
                        if (subType === 'normal') return;
                        const subLabel = sub.label || '';
                        const subDefault = sub.newDefaultValue || sub.defaultValue || '';
                        columns.push({
                            index: colIndex++,
                            key: '新' + subLabel,
                            label: '新' + subLabel,
                            type: 'text',
                            category: 'sub',
                            bindingKey: sub.bindingKey,
                            parentKey: item.bindingKey,
                            width: calculateOptimalColumnWidth('新' + subLabel),
                            hasDefault: !!subDefault,
                            defaultValue: String(subDefault)
                        });
                    });
                }
            });

            // 所有更新字段的原值列在后
            updateItems.forEach(item => {
                const inputType = item.inputType;
                if (inputType === 'calculated') return;
                const originDefault = item.originDefaultValue ? String(item.originDefaultValue) : '';
                columns.push({
                    index: colIndex++,
                    key: '原' + item.label,
                    label: '原' + item.label,
                    type: 'text',
                    category: 'update',
                    bindingKey: item.bindingKey,
                    width: calculateOptimalColumnWidth('原' + item.label),
                    hasDefault: !!originDefault,
                    defaultValue: originDefault
                });
                if (inputType === 'supplement') {
                    (item.subFields || []).forEach(sub => {
                        const subType = sub.type || 'normal';
                        if (subType === 'normal') return;
                        const subLabel = sub.label || '';
                        const subDefault = sub.originDefaultValue || sub.defaultValue || '';
                        columns.push({
                            index: colIndex++,
                            key: '原' + subLabel,
                            label: '原' + subLabel,
                            type: 'text',
                            category: 'sub',
                            bindingKey: sub.bindingKey,
                            parentKey: item.bindingKey,
                            width: calculateOptimalColumnWidth('原' + subLabel),
                            hasDefault: !!subDefault,
                            defaultValue: String(subDefault)
                        });
                    });
                }
            });

            return columns;
        }

        /**
         * 构造 Luckysheet 的 sheet 配置
         */
        function buildSheetConfig(formConfig, order) {
            const columns = buildSpreadsheetColumns(formConfig);
            // 将列定义缓存到配置对象，后续读取数据时直接使用
            formConfig.columns = columns;

            const sheetName = sanitizeSheetName(formConfig.formName);
            const savedRows = savedOnlineRowsPerSheet[sheetName] || [];

            const totalCols = Math.max(columns.length + 10, 20);
            const totalRows = Math.max(savedRows.length + 20, 500);

            const celldata = [];
            const columnlen = {};

            columns.forEach((col, idx) => {
                columnlen[idx] = col.width;
                // 表头：有默认值标黄，否则淡蓝
                const headerBg = col.hasDefault ? '#fff3cd' : '#e8f4f8';
                celldata.push({
                    r: 0,
                    c: idx,
                    v: {
                        v: col.label,
                        ct: { fa: 'General', t: 'g' },
                        m: col.label,
                        bg: headerBg,
                        ff: 'Arial',
                        fs: 12,
                        bl: 1,
                        ht: 0,
                        vt: 0
                    }
                });
            });

            // 第一行作为默认值示例
            columns.forEach((col, idx) => {
                const defaultValue = col.defaultValue || '';
                if (defaultValue) {
                    celldata.push({
                        r: 1,
                        c: idx,
                        v: {
                            v: defaultValue,
                            ct: { fa: 'General', t: 'g' },
                            m: String(defaultValue),
                            bg: '#fff3cd',
                            ff: 'Arial',
                            fs: 11,
                            ht: 0,
                            vt: 0
                        }
                    });
                }
            });

            // 回显已保存的数据
            savedRows.forEach((row, rIdx) => {
                const rowNum = rIdx + 2; // 第0行表头，第1行默认值示例
                columns.forEach((col, idx) => {
                    const val = row[col.label];
                    if (val !== undefined && val !== null && String(val).trim() !== '') {
                        celldata.push({
                            r: rowNum,
                            c: idx,
                            v: {
                                v: String(val),
                                ct: { fa: 'General', t: 'g' },
                                m: String(val),
                                ff: 'Arial',
                                fs: 11,
                                ht: 0,
                                vt: 0
                            }
                        });
                    }
                });
            });

            return {
                name: sheetName,
                color: '',
                status: order === 0 ? 1 : 0,
                order: order,
                index: order,
                row: totalRows,
                column: totalCols,
                celldata: celldata,
                config: {
                    columnlen: columnlen,
                    rowlen: { 0: 28 },
                    merge: {}
                }
            };
        }

        /**
         * 批量设置 Luckysheet 单元格值
         */
        function batchSetRangeValues(rangeValues) {
            if (!rangeValues || rangeValues.length === 0) return;
            if (typeof luckysheet.setRangeValue === 'function') {
                try {
                    let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
                    rangeValues.forEach(item => {
                        minR = Math.min(minR, item.r);
                        maxR = Math.max(maxR, item.r);
                        minC = Math.min(minC, item.c);
                        maxC = Math.max(maxC, item.c);
                    });
                    const rowCount = maxR - minR + 1;
                    const colCount = maxC - minC + 1;
                    const data = [];
                    for (let r = 0; r < rowCount; r++) {
                        const row = [];
                        for (let c = 0; c < colCount; c++) {
                            row.push('');
                        }
                        data.push(row);
                    }
                    rangeValues.forEach(item => {
                        data[item.r - minR][item.c - minC] = item.v;
                    });
                    luckysheet.setRangeValue(data, {
                        range: { row: [minR, maxR], column: [minC, maxC] },
                        isRefresh: true
                    });
                    return;
                } catch (e) {
                    console.warn('[WARN] setRangeValue 批量写入失败，回退到 setCellValue:', e);
                }
            }
            rangeValues.forEach(item => {
                luckysheet.setCellValue(item.r, item.c, item.v);
            });
        }

        function doOpenOnlineEditor() {
            const loadingIndex = layui.layer.load(2);

            const fetchPromises = selectedFormIds.map(formId =>
                fetch(`/api/form-config/${formId}/`)
                    .then(response => response.json())
                    .then(data => data.success ? data.data : null)
                    .catch(error => {
                        console.error('获取表单配置失败:', error);
                        return null;
                    })
            );

            Promise.all(fetchPromises).then(configs => {
                layui.layer.close(loadingIndex);

                if (validConfigs.length === 0) {
                    layui.layer.msg('获取表单配置失败', {icon: 2});
                    return;
                }

                onlineEditorConfigs = {};
                const sheetConfigs = [];
                validConfigs.forEach((config, idx) => {

                    sheetConfigs.push(buildSheetConfig(config, idx));

                const modalEl = document.getElementById('luckysheetModal');
                let modalInstance = bootstrap.Modal.getInstance(modalEl);

                            activate: function () {},

                            document.activeElement.blur();

                        initLuckysheet(sheetConfigs);
                    });

                    modalEl.addEventListener('hidden.bs.modal', function () {

                            try {

                            } catch (e) {

        /**
         * 读取 Luckysheet 中的所有有效数据行
         */
        function getCellValue(cell) {
            if (cell === null || cell === undefined) return '';
            if (typeof cell === 'object') {
                return cell.v !== undefined ? cell.v : (cell.m !== undefined ? cell.m : '');
            }
            return cell;
        }

        function getSpreadsheetData() {
            if (!luckySheetReady || typeof luckysheet === 'undefined') return {};

            const result = {};
            const sheets = luckysheet.getAllSheets ? luckysheet.getAllSheets() : [];
            if (!sheets || sheets.length === 0) return result;

            sheets.forEach(sheet => {
                const sheetName = sheet.name;
                const config = onlineEditorConfigs[sheetName];
                if (!config) return;

                const columns = config.columns || buildSpreadsheetColumns(config);
                const rows = [];
                const sheetData = sheet.data || [];

                sheetData.forEach((row, rIdx) => {
                    if (!row || rIdx === 0) return; // 跳过表头
                    const rowData = {};
                    let hasValue = false;
                    columns.forEach((col, cIdx) => {
                        const cellValue = getCellValue(row[cIdx]);
                        const strValue = cellValue !== null && cellValue !== undefined ? String(cellValue).trim() : '';
                        if (strValue) {
                            rowData[col.label] = strValue;
                            hasValue = true;
                        }
                    });
                    if (hasValue) {
                        rows.push(rowData);
                    }
                });

                result[sheetName] = rows;
            });

            return result;
        }

        /**
         * 清空错误信息列（只清空实际显示过错误的单元格，避免全表逐行写入导致卡顿）
         */
        function clearErrorColumn() {
            if (!luckySheetReady || typeof luckysheet === 'undefined') return;
            if (!displayedValidationErrors) return;

            Object.entries(displayedValidationErrors).forEach(([sheetName, rowErrors]) => {
                if (!rowErrors || rowErrors.length === 0) return;
                const config = onlineEditorConfigs[sheetName];
                if (!config) return;
                const errorColIndex = (config.columns || buildSpreadsheetColumns(config)).length;

                const rangeValues = [{ r: 0, c: errorColIndex, v: '' }];
                rowErrors.forEach(err => {
                    const frontendRow = (err.rowIndex || 0) - 1;
                    if (frontendRow > 0) {
                        rangeValues.push({ r: frontendRow, c: errorColIndex, v: '' });
                    }
                });

                batchSetRangeValues(rangeValues);
            });

            displayedValidationErrors = null;
        }

        /**
         * 将后端返回的行级校验错误填充到对应 Sheet 的错误列
         */
        function fillValidationErrors(errorsBySheet) {
            if (!luckySheetReady || typeof luckysheet === 'undefined') return;
            if (!errorsBySheet) return;

            // 记录当前显示的错误，用于后续快速清空
            displayedValidationErrors = JSON.parse(JSON.stringify(errorsBySheet));

            Object.entries(errorsBySheet).forEach(([sheetName, rowErrors]) => {
                if (!rowErrors || rowErrors.length === 0) return;
                const config = onlineEditorConfigs[sheetName];
                if (!config) return;
                const columns = config.columns || buildSpreadsheetColumns(config);
                const errorColIndex = columns.length;

                // 切换到对应 Sheet
                try {
                    const sheets = luckysheet.getAllSheets ? luckysheet.getAllSheets() : [];
                    const target = sheets.find(s => s.name === sheetName);
                    if (target && typeof luckysheet.setSheetActive === 'function') {
                        luckysheet.setSheetActive(target.index);
                    }
                } catch (e) {
                    console.warn('[WARN] 切换 Sheet 失败:', e);
                }

                // 错误列表头
                luckysheet.setCellValue(0, errorColIndex, {
                    v: '错误信息',
                    ct: { fa: 'General', t: 'g' },
                    m: '错误信息',
                    bg: '#ffcccc',
                    ff: 'Arial',
                    fs: 12,
                    bl: 1,
                    ht: 0,
                    vt: 0
                });
                if (typeof luckysheet.setColumnWidth === 'function') {
                    luckysheet.setColumnWidth({ [errorColIndex]: 280 });
                }

                rowErrors.forEach(err => {
                    const backendRowIndex = err.rowIndex;
                    const frontendRow = backendRowIndex - 1;
                    const failReason = err.failReason || '';
                    if (frontendRow > 0) {
                        luckysheet.setCellValue(frontendRow, errorColIndex, {
                            v: failReason,
                            ct: { fa: 'General', t: 'g' },
                            m: failReason,
                            bg: '#fff3cd',
                            fc: '#856404',
                            ff: 'Arial',
                            fs: 11,
                            ht: 0,
                            vt: 0
                        });
                    }
                });
            });
        }

        /**

        window.saveOnlineEditorData = function () {
            if (!luckySheetReady || typeof luckysheet === 'undefined') {
                layui.layer.msg('表格尚未就绪，请稍后再试', {icon: 2});
                return;
            }

                        // 错误列在读取数据时不会被读取；关闭弹窗后表格会销毁，
            // 因此保存前不必清空错误列，避免触发不必要的 setRangeValue / Web Worker

            const rowsPerSheet = getSpreadsheetData();
            const validationErrors = validateOnlineData(rowsPerSheet);
            if (validationErrors.length > 0) {
                layui.layer.msg('校验失败：' + validationErrors[0], {icon: 2});
                return;

            const totalRows = Object.values(rowsPerSheet).reduce((sum, rows) => sum + rows.length, 0);
            if (totalRows === 0) {
                layui.layer.msg('没有数据可保存，请先在表格中填写数据', {icon: 2});
                return;

            updateOnlineEditorStatus();

        };

        /**
         * 校验在线编辑数据
         */
        function validateOnlineData(rowsPerSheet) {
            const errors = [];

            for (const [sheetName, rows] of Object.entries(rowsPerSheet)) {
                const config = onlineEditorConfigs[sheetName];
                if (!config) continue;

                const queryItems = config.queryItems || [];
                const updateItems = config.updateItems || [];

                rows.forEach((row, rowIdx) => {
                    const hasQueryValue = queryItems.some(item => {
                        const value = row[item.label];
                        return value !== undefined && String(value).trim() !== '';
                    });
                    if (!hasQueryValue) {
                        errors.push(`[${sheetName}] 第${rowIdx + 1}行：查询字段至少需要填写一个条件`);
                    }

                    const hasUpdateValue = updateItems.some(item => {
                        if (item.inputType === 'calculated') return false;
                        const newValue = row['新' + item.label];
                        const originValue = row['原' + item.label];
                        return (newValue !== undefined && String(newValue).trim() !== '') ||
                               (originValue !== undefined && String(originValue).trim() !== '');
                    });
                    if (!hasUpdateValue) {
                        errors.push(`[${sheetName}] 第${rowIdx + 1}行：更新字段至少需要填写一个新值或原值`);
                    }
                });
            }

            return errors;
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /**
         * 预览数据通用函数
         */
        function previewRowsPerSheet(rowsPerSheet, title) {
            const container = document.getElementById('onlineDataPreviewTable');
            const totalRows = Object.values(rowsPerSheet).reduce((sum, rows) => sum + rows.length, 0);

            if (totalRows === 0) {
                container.innerHTML = '<p class="text-muted">暂无数据</p>';
            } else {
                let html = '';
                for (const [sheetName, rows] of Object.entries(rowsPerSheet)) {
                    if (rows.length === 0) continue;
                    const config = onlineEditorConfigs[sheetName];
                    const columns = config ? (config.columns || buildSpreadsheetColumns(config)) : [];
                    const headers = columns.length > 0 ? columns.map(c => c.label) : Object.keys(rows[0]);

                    html += `<h6 class="mt-3 mb-2">${escapeHtml(sheetName)}</h6>`;
                    html += '<table class="table table-sm table-bordered table-striped preview-table"><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + escapeHtml(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(row => {
                        html += '<tr>';
                        headers.forEach(h => {
                            html += '<td>' + escapeHtml(row[h] || '') + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                }
                container.innerHTML = html;
            }

            document.getElementById('onlineDataPreviewModalLabel').textContent = title;
            const modalEl = document.getElementById('onlineDataPreviewModal');
            let modalInstance = bootstrap.Modal.getInstance(modalEl);
            if (!modalInstance) {
                modalInstance = new bootstrap.Modal(modalEl, { focus: false });
            }
            modalInstance.show();
        }

        /**
         * 处理导入到在线编辑器的文件
         */
        window.handleXsFileImport = function (input) {
            const file = input.files[0];
            if (!file) return;
            input.value = '';

            if (!file.name.endsWith('.xlsx')) {
                layui.layer.msg('请选择 .xlsx 格式的 Excel 文件', {icon: 2});
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    if (workbook.SheetNames.length === 0) {
                        layui.layer.msg('文件为空', {icon: 2});
                        return;
                    }

                    clearSpreadsheetData();

                    workbook.SheetNames.forEach(sheetName => {
                        const config = onlineEditorConfigs[sheetName];
                        if (!config) return;

                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                        if (jsonData.length === 0) return;

                        const columns = config.columns || buildSpreadsheetColumns(config);
                        const fileHeaders = jsonData[0].map(h => String(h).trim());
                        const colMap = {};
                        fileHeaders.forEach((h, fileIdx) => {
                            const col = columns.find(c => c.label === h || c.key === h);
                            if (col) {
                                colMap[col.index] = fileIdx;
                            }
                        });

                        const rangeValues = [];
                        for (let i = 1; i < jsonData.length; i++) {
                            const fileRow = jsonData[i];
                            columns.forEach(col => {
                                const fileIdx = colMap[col.index];
                                if (fileIdx === undefined) return;
                                const value = fileRow[fileIdx];
                                if (value !== undefined && value !== null && String(value).trim() !== '') {
                                    rangeValues.push({
                                        r: i,
                                        c: col.index,
                                        v: String(value)
                                    });
                                }
                            });
                        }

                        batchSetRangeValues(rangeValues);
                    });

                    currentOnlineRowsPerSheet = getSpreadsheetData();
                    layui.layer.msg('文件导入成功', {icon: 1});
                } catch (err) {
                    console.error('导入失败:', err);
                    layui.layer.msg('文件解析失败：' + err.message, {icon: 2});
                }
            };
            reader.readAsArrayBuffer(file);
        };

                .catch(error => {

        /**
         * 显示批量导入结果
         */
        function showBatchImportResult(data) {
            const resultArea = document.getElementById('submitResultArea');
            const alert = document.getElementById('resultAlert');
            const title = document.getElementById('resultTitle');
            const message = document.getElementById('resultMessage');
            const actions = document.getElementById('resultActions');

            if (data.success) {
                alert.className = 'alert alert-success';
                title.textContent = '批量导入成功！';
            } else {
                alert.className = 'alert alert-warning';
                title.textContent = '批量导入部分失败';
            }

            let msg = '<strong>处理结果：</strong><br>';
            msg += '总Sheet数: ' + (data.totalSheets || 0) + '<br>';
            msg += '成功: ' + (data.successCount || 0) + ' 个Sheet<br>';
            msg += '失败: ' + (data.failCount || 0) + ' 个Sheet<br>';

            if (data.sqlFilePath) {
                msg += '<br><strong>SQL文件路径：</strong><br>';
                msg += '<span style="color: #1890ff; font-family: monospace;">' + data.sqlFilePath + '</span><br>';
            }
            if (data.excelFilePath) {
                msg += '<br><strong>Excel结果文件路径：</strong><br>';
                msg += '<span style="color: #1890ff; font-family: monospace;">' + data.excelFilePath + '</span><br>';
            }

            if (data.failed_sheets && data.failed_sheets.length > 0) {
                msg += '<br><span class="text-warning">失败详情：</span><br>';
                data.failed_sheets.forEach(failed => {
                    msg += '- <strong>' + failed.sheet + '</strong>: ' + failed.error + '<br>';
                });
            }

            message.innerHTML = msg;
            actions.innerHTML = '';
            resultArea.style.display = 'block';
            resultArea.scrollIntoView({behavior: 'smooth'});

            // 清空文件选择
            document.getElementById('batchImportFile').value = '';
            document.getElementById('batchImportFileName').textContent = '';

            // 收集行级错误，回显到在线编辑表格
            const errorsBySheet = {};
            let hasRowErrors = false;
            if (data.failed_sheets && data.failed_sheets.length > 0) {
                data.failed_sheets.forEach(failed => {
                    if (failed.rowErrors && failed.rowErrors.length > 0) {
                        errorsBySheet[failed.sheet] = failed.rowErrors;
                        hasRowErrors = true;
                    }
                });
            }

            if (hasRowErrors) {
                pendingValidationErrors = errorsBySheet;
                openOnlineEditor();
                layui.layer.msg('校验失败，请查看在线编辑表格中的错误列', {icon: 2});
            } else if (data.success) {
                savedOnlineRowsPerSheet = {};
                currentOnlineRowsPerSheet = {};
                updateOnlineEditorStatus();
                layui.layer.msg('批量导入完成！', {icon: 1});
            } else {
                layui.layer.msg('批量导入部分失败，请查看下方详细信息', {icon: 0, time: 3000});
            }
        }


        /**
         * 清除指定字段的错误样式
         * @param {HTMLElement} element - 输入框元素
         * @param {string} errorId - 错误元素ID
         */
        function clearFieldError(element, errorId) {
            if (!element) return;

            // 清除错误样式
            element.style.borderColor = '';
            element.style.boxShadow = '';
            element.style.backgroundColor = '';

            // 移除错误提示元素
            const errorElement = document.getElementById(errorId);
            if (errorElement) {
                errorElement.remove();
            }

            // 移除事件监听器
            if (element._clearErrorHandler) {
                const eventType = element.type === 'radio' || element.type === 'checkbox' ? 'change' : 'input';
                element.removeEventListener(eventType, element._clearErrorHandler);
                element._clearErrorHandler = null;
            }
        }
    </script>
{% endblock %}
